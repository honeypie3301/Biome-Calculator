# ==============================================================================
# CRITICAL NOTICE / REMINDER:
# DO NOT DELETE THIS FILE (deploy.yml)!
# This GitHub Actions workflow is strictly REQUIRED for automated GitHub Pages
# deployment whenever changes are pushed to main/master.
#
# UI & DESIGN REMINDER:
# All dropdown menus, buttons, inputs, and interactive controls across the app
# MUST strictly follow the dark Minecraft-themed ember palette:
# - Dark backgrounds: #070505, #0c0808, #110c0c
# - Borders: #1c1212, #301614, #521c16
# - Ember accents: #ff7043, #ff8a65, #ffab91
# - Fonts: High legibility with font-mono for numbers and coordinate matrices.
# ==============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Upload Pages Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
