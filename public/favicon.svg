<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Biome Grid blocky representation -->
  <!-- Row 1 -->
  <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#ff7043"/>
  <rect x="9" y="2" width="6" height="6" rx="1.5" fill="#4db6ac"/>
  <rect x="16" y="2" width="6" height="6" rx="1.5" fill="#9ccc65"/>
  <rect x="23" y="2" width="6" height="6" rx="1.5" fill="#64b5f6"/>
  <!-- Row 2 -->
  <rect x="2" y="9" width="6" height="6" rx="1.5" fill="#ba68c8"/>
  <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#ffe082"/>
  <rect x="16" y="9" width="6" height="6" rx="1.5" fill="#ff7043"/>
  <rect x="23" y="9" width="6" height="6" rx="1.5" fill="#4db6ac"/>
  <!-- Row 3 -->
  <rect x="2" y="16" width="6" height="6" rx="1.5" fill="#9ccc65"/>
  <rect x="9" y="16" width="6" height="6" rx="1.5" fill="#64b5f6"/>
