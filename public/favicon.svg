  <!-- Elegant center crosshair targeting reticle -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="16" y1="4" x2="16" y2="8" stroke="#ffffff" stroke-width="2"/>
  <line x1="16" y1="24" x2="16" y2="28" stroke="#ffffff" stroke-width="2"/>
  <line x1="4" y1="16" x2="8" y2="16" stroke="#ffffff" stroke-width="2"/>
